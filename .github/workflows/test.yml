name: Test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs of a PR; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise hold the runner for GitHub's default of 6 hours.  These
    # jobs take a few minutes.
    timeout-minutes: 30
    defaults:
      run:
        # -e: a custom shell gets no errexit, so without it a multi-command step
        # (e.g. "Test") would only report the exit status of its last command.
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        source: ["conda-forge"]
        # os: ["ubuntu-latest"]
        # source: ["source"]
        # A trailing "t" means the free-threaded (no-GIL) build of that version.
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        include:
          # Also build psg without complex types (GraphBLAS always has them) and test that.
          # GraphBLAS is from conda-forge; "-no-complex" sets the switch in "Build".
          - os: ubuntu-latest
            source: conda-forge-no-complex
            python-version: "3.15"
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Compose conda environment file
      env:
        PYVER: ${{ matrix.python-version }}
      run: |
        # conda-forge ships two ABIs for CPython 3.13+ ("cp314" and "cp314t"),
        # and `python=3.14` alone lets the solver pick either one: it resolved
        # to free-threaded on Linux and Windows but to the GIL build on macOS.
        # The `python-gil` and `python-freethreading` metapackages pin
        # `python_abi` to one or the other, so ask for the one this matrix
        # entry wants instead of leaving it to the solver.
        pyver=$PYVER
        if [[ $pyver == *t ]]; then
          variant=python-freethreading
          pyver=${pyver%t}
        else
          variant=python-gil
        fi
        cp continuous_integration/environment.yml environment-ci.yml
        echo "  - python=$pyver" >> environment-ci.yml
        echo "  - $variant" >> environment-ci.yml
        if [[ $PYVER == *t ]]; then
          echo "  - pytest-run-parallel" >> environment-ci.yml  # see "Test"
        fi
        cat environment-ci.yml
    - name: Conda
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        auto-update-conda: true
        environment-file: environment-ci.yml
        # setup-miniconda deprecated a `nodefaults` channel here in favor of
        # conda-remove-defaults (environment.yml keeps it for conda itself).
        channels: conda-forge
        conda-remove-defaults: true
        channel-priority: strict
        activate-environment: suitesparse-graphblas
        auto-activate: false
    - name: GraphBLAS (from conda-forge)
      if: (contains(matrix.source, 'conda-forge'))
      run: |
        conda install "graphblas=$(cat GB_VERSION.txt)"
    - name: GraphBLAS (from source)
      if: (contains(matrix.source, 'source'))
      run: |
        # From release (also works with beta versions)
        GRAPHBLAS_PREFIX="${CONDA_PREFIX}" bash suitesparse.sh "refs/tags/$(cat GB_VERSION.txt).0"

        # From tag
        # curl -L https://github.com/DrTimothyAldenDavis/GraphBLAS/archive/refs/tags/v$(cat GB_VERSION.txt).tar.gz | tar xzf -
        # pushd GraphBLAS-$(cat GB_VERSION.txt)/build

        # From branch
        # curl -L https://github.com/DrTimothyAldenDavis/GraphBLAS/tarball/$(cat GB_VERSION.txt) | tar xzf -
        # pushd DrTim*/build

        # echo ${CONDA_PREFIX}
        # cmake -DJITINIT=2 -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX} -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=Release ..
        # cat Makefile
        # make all JOBS=16
        # make install
        # popd
    - name: Build
      env:
        SUITESPARSE_GRAPHBLAS_NO_COMPLEX: ${{ contains(matrix.source, 'no-complex') && '1' || '' }}
      run: |
        pip install -e . --no-deps
        if [[ -n $SUITESPARSE_GRAPHBLAS_NO_COMPLEX ]]; then
          python -c 'import suitesparse_graphblas as ssgb; assert not ssgb.supports_complex()'
        fi
    - name: Test
      env:
        PYVER: ${{ matrix.python-version }}
      run: |
        pytest -s -k test_print_jit_config
        # Coverage of the Python code; see [tool.coverage.run] in pyproject.toml.
        coverage run -a -m pytest
        coverage run -a suitesparse_graphblas/tests/test_initialize.py
        if [[ $PYVER == *t ]]; then
          # Without a GIL, threads run Python code in parallel, so also run each test in 4
          # threads at once, 10 times each, to find races (in psg, GraphBLAS, or a test).
          # pytest-run-parallel ignores warnings raised in its threads, so this adds to the
          # run above rather than replacing it.
          pytest --parallel-threads=4 --iterations=10
        fi
    - name: create_headers.py check
      if: (! contains(matrix.os, 'windows'))
      run: |
        coverage run -a suitesparse_graphblas/create_headers.py
        git diff --exit-code  # error if anything changed
    - name: Coverage report
      run: |
        coverage report --show-missing
        coverage xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: coverage.xml
        disable_search: true
        # The "Coverage report" step wrote coverage.xml, so skip the uploader's own search for
        # gcov, Xcode, Swift and coverage.py data (it only logs a warning for each).
        plugins: noop
        name: ${{ matrix.os }} ${{ matrix.python-version }}${{ contains(matrix.source, 'no-complex') && ' no-complex' || '' }}
        # PRs from forks upload without a token.  Pushes to main need the repository
        # secret CODECOV_TOKEN.  An upload that fails doesn't fail the job.
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
